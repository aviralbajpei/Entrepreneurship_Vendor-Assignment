<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ahmed Bangles – अहमद बँगल्स</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&family=Yatra+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#FBF3F7; --surface2:#F3E6EE; --ink:#2A1236; --muted:#6F5E78; --line:#EADBE3;
  --brand:#A3124F; --brand-ink:#FFFFFF; --gold:#D48E00; --ok:#137544; --ok-bg:#E2F3E9;
  --bad:#BF261C; --bad-bg:#FBE5E2; --warn-bg:#FFF1D2; --scrim:rgba(30,10,30,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#160E1C; --surface:#22172B; --surface2:#2D2038; --ink:#F7EEF4; --muted:#BCAAC6; --line:#3B2B48;
    --brand:#E8589A; --brand-ink:#1A0E1F; --gold:#F5B82E; --ok:#4CC88A; --ok-bg:#15301F;
    --bad:#FF7A6E; --bad-bg:#3A1A1A; --warn-bg:#3A2C10; --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#160E1C; --surface:#22172B; --surface2:#2D2038; --ink:#F7EEF4; --muted:#BCAAC6; --line:#3B2B48;
  --brand:#E8589A; --brand-ink:#1A0E1F; --gold:#F5B82E; --ok:#4CC88A; --ok-bg:#15301F;
  --bad:#FF7A6E; --bad-bg:#3A1A1A; --warn-bg:#3A2C10; --scrim:rgba(0,0,0,.6);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:400 18px/1.45 'Mukta','Noto Sans Devanagari','Nirmala UI',system-ui,sans-serif;-webkit-text-size-adjust:100%}
img{max-width:100%;display:block}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.toprow{display:flex;align-items:center;gap:10px;padding:10px 0}
.mark{width:40px;height:36px;flex:none}
.shopname{font-family:'Yatra One','Mukta',serif;font-size:22px;line-height:1.1;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langs{display:flex;background:var(--surface2);border-radius:999px;padding:3px;flex:none}
.langs button{border:0;background:none;border-radius:999px;padding:6px 10px;font-weight:600;font-size:15px;min-width:44px;min-height:40px}
.langs button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.iconbtn{border:0;background:var(--surface2);border-radius:14px;width:46px;height:46px;font-size:22px;display:grid;place-items:center;flex:none}
.iconbtn.on{background:var(--brand);color:var(--brand-ink)}
.band{height:9px;background:repeating-linear-gradient(90deg,#1E8A4C 0 7px,#D4AF37 7px 9px,#C8281E 9px 16px,#F07B12 16px 23px,#D4AF37 23px 25px,#A3124F 25px 32px,#0B6E80 32px 39px,#D4AF37 39px 41px,#E8559A 41px 48px)}
.lowbar{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--bad-bg);color:var(--bad);font-weight:600;padding:10px 16px;text-align:left}
.lowbar span{flex:1}

main{padding-bottom:40px}
body.owner main{padding-bottom:120px}
h2{font-size:24px;margin:26px 0 12px;font-weight:800;line-height:1.2}
h3{font-size:19px;margin:18px 0 8px;font-weight:800}
.muted{color:var(--muted)}
.small{font-size:15px}

/* hero */
.hero{position:relative;isolation:isolate;margin-top:14px;border-radius:28px;overflow:hidden;color:#FFF6EA;
  background-color:#3A0A2B;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22160%22%20height%3D%22160%22%3E%3Cg%20fill%3D%22none%22%20stroke-width%3D%223%22%20opacity%3D%22.22%22%3E%3Cellipse%20cx%3D%2240%22%20cy%3D%2222%22%20rx%3D%2224%22%20ry%3D%227%22%20stroke%3D%22%23E9B949%22/%3E%3Cellipse%20cx%3D%2240%22%20cy%3D%2228%22%20rx%3D%2224%22%20ry%3D%227%22%20stroke%3D%22%23E2455B%22/%3E%3Cellipse%20cx%3D%2240%22%20cy%3D%2234%22%20rx%3D%2224%22%20ry%3D%227%22%20stroke%3D%22%23E9B949%22/%3E%3Cellipse%20cx%3D%2240%22%20cy%3D%2240%22%20rx%3D%2224%22%20ry%3D%227%22%20stroke%3D%22%233FB37A%22/%3E%3Cellipse%20cx%3D%2240%22%20cy%3D%2246%22%20rx%3D%2224%22%20ry%3D%227%22%20stroke%3D%22%23E9B949%22/%3E%3Cellipse%20cx%3D%22120%22%20cy%3D%2298%22%20rx%3D%2224%22%20ry%3D%227%22%20stroke%3D%22%23F28C28%22/%3E%3Cellipse%20cx%3D%22120%22%20cy%3D%22104%22%20rx%3D%2224%22%20ry%3D%227%22%20stroke%3D%22%23E9B949%22/%3E%3Cellipse%20cx%3D%22120%22%20cy%3D%22110%22%20rx%3D%2224%22%20ry%3D%227%22%20stroke%3D%22%23E8559A%22/%3E%3Cellipse%20cx%3D%22120%22%20cy%3D%22116%22%20rx%3D%2224%22%20ry%3D%227%22%20stroke%3D%22%23E9B949%22/%3E%3Cellipse%20cx%3D%22120%22%20cy%3D%22122%22%20rx%3D%2224%22%20ry%3D%227%22%20stroke%3D%22%23F28C28%22/%3E%3C/g%3E%3Cg%20fill%3D%22%23E9B949%22%20opacity%3D%22.25%22%3E%3Ccircle%20cx%3D%22118%22%20cy%3D%2230%22%20r%3D%222%22/%3E%3Ccircle%20cx%3D%2242%22%20cy%3D%22118%22%20r%3D%222%22/%3E%3Ccircle%20cx%3D%2280%22%20cy%3D%2270%22%20r%3D%221.5%22/%3E%3C/g%3E%3C/svg%3E");background-size:160px 160px;
  display:grid;grid-template-columns:1fr;gap:20px;padding:26px 20px 28px}
.hero::before{content:'';position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse 70% 60% at 50% 18%,rgba(242,160,7,.42),transparent 70%),linear-gradient(180deg,transparent 55%,rgba(20,4,16,.55))}
.hero-photo{justify-self:center;width:min(70%,300px);aspect-ratio:3/4;border-radius:999px 999px 24px 24px;overflow:hidden;border:4px solid #E9B949;box-shadow:0 0 0 8px rgba(233,185,73,.18),0 18px 40px rgba(0,0,0,.35)}
.hero-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 42%}
.hero-text{text-align:center}
.hero h1{font-family:'Yatra One','Mukta',serif;font-weight:400;font-size:clamp(44px,10vw,76px);line-height:1.02;margin:0;color:#FFF6EA;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.hero-text p{margin:10px auto 0;font-size:19px;max-width:30ch;color:#F5DCC4}
.rings{display:flex;justify-content:center;gap:5px;margin-top:16px}
.rings svg{width:18px;height:18px}
@media (min-width:720px){
  .hero{grid-template-columns:1.25fr 1fr;align-items:center;padding:40px 48px;gap:36px}
  .hero::before{background:radial-gradient(ellipse 55% 75% at 78% 45%,rgba(242,160,7,.42),transparent 70%),linear-gradient(90deg,rgba(20,4,16,.35),transparent 60%)}
  .hero-photo{order:2;width:100%;max-width:330px}
  .hero-text{text-align:left}
  .hero-text p{margin-left:0;font-size:22px}
  .rings{justify-content:flex-start}
}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.actions .wide{grid-column:1/-1}
@media (max-width:420px){body.v-shop .shopname{visibility:hidden}.shopname{font-size:19px}}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:10px 16px;border-radius:16px;border:2px solid transparent;
  background:var(--surface2);font-weight:600;font-size:18px;text-decoration:none;color:var(--ink);text-align:center;line-height:1.2}
.btn .ic{font-size:24px}
.btn.brand{background:var(--brand);color:var(--brand-ink)}
.btn.wa{background:#1F9D55;color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn.line{background:transparent;border-color:var(--line)}
.btn.big{min-height:72px;font-size:20px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.ok,:root:not([data-theme="light"]) .btn.bad{color:#170c12}}
:root[data-theme="dark"] .btn.ok,:root[data-theme="dark"] .btn.bad{color:#170c12}

/* search */
.search{display:flex;gap:10px;align-items:center;margin:20px 0 6px}
.search input{flex:1;min-width:0;height:60px;border-radius:999px;border:2px solid var(--line);background:var(--bg);padding:0 22px;font-size:19px}
.search input:focus{border-color:var(--brand);outline:none}
.mic{width:60px;height:60px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-size:26px;flex:none;display:grid;place-items:center}
.mic.sm{width:48px;height:48px;font-size:22px}
.mic.live{animation:pulse 1s ease-in-out infinite;background:var(--bad);color:#fff}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(191,38,28,.5)}50%{box-shadow:0 0 0 12px rgba(191,38,28,0)}}

/* categories */
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.cat{border:2px solid var(--line);background:var(--bg);border-radius:18px;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:15px;line-height:1.15;text-align:center}
.cat .art{width:56px;height:52px;display:grid;place-items:center;font-size:36px}
.cat .art svg{width:100%;height:100%}
.cat[aria-pressed="true"]{border-color:var(--brand);background:var(--surface)}
@media (max-width:420px){.cats{grid-template-columns:repeat(3,1fr)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chip{flex:none;border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 16px;font-weight:600;font-size:16px;min-height:44px;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

/* products */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px;margin-top:12px}
.card{border:0;background:var(--surface);border-radius:20px;padding:0;text-align:left;overflow:hidden;display:flex;flex-direction:column}
.card .pic{aspect-ratio:1/1;display:grid;place-items:center;font-size:64px;position:relative;overflow:hidden}
.card .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .pic svg{width:80%;height:80%}
.card .body{padding:10px 12px 12px}
.card .nm{font-weight:600;font-size:17px;line-height:1.25}
.card .pr{font-weight:800;font-size:21px;margin-top:2px}
.card .pr small{font-weight:400;font-size:14px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;border-radius:999px;padding:2px 10px;margin-top:6px}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.few{background:var(--warn-bg);color:var(--gold)}
.badge.out{background:var(--bad-bg);color:var(--bad)}
.pic .inside{position:absolute;left:8px;top:8px;background:var(--bg);color:var(--ink);font-size:13px;font-weight:600;border-radius:999px;padding:2px 9px}
.note{display:flex;gap:12px;align-items:center;background:var(--warn-bg);border-radius:18px;padding:14px 16px;margin-top:18px;font-weight:600}
.note .ic{font-size:34px;flex:none}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty .ic{font-size:48px}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photos img{border-radius:18px;aspect-ratio:3/4;object-fit:cover;width:100%}
footer{margin-top:30px;padding:20px 0;color:var(--muted);font-size:15px;border-top:1px solid var(--line)}

/* owner nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom button{border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;font-weight:600;color:var(--muted);min-height:66px}
nav.bottom button .ic{font-size:27px;line-height:1.1;filter:grayscale(.6);opacity:.8}
nav.bottom button[aria-current="page"]{color:var(--brand)}
nav.bottom button[aria-current="page"] .ic{filter:none;opacity:1}

/* lists */
.rows{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.row{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:18px;padding:10px 12px;border:0;text-align:left;width:100%}
.row .art{width:60px;height:60px;border-radius:14px;overflow:hidden;display:grid;place-items:center;font-size:32px}
.row .art img{width:100%;height:100%;object-fit:cover}
.row .art svg{width:90%;height:90%}
.row .t1{font-weight:600;font-size:18px;line-height:1.2}
.row .t2{font-size:15px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:46px;height:46px;border-radius:14px;border:0;background:var(--bg);font-size:26px;font-weight:800;line-height:1}
.qty b{min-width:42px;text-align:center;font-size:22px}
.qty b.low{color:var(--bad)}
.avatar{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:24px;color:#fff}
.amt{font-weight:800;font-size:20px;text-align:right;line-height:1.1}
.amt small{display:block;font-size:13px;font-weight:600}
.amt.due{color:var(--bad)}
.amt.clear{color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.stat{background:var(--surface);border-radius:18px;padding:12px 14px}
.stat .v{font-size:26px;font-weight:800;line-height:1.1}
.stat .l{font-size:15px;color:var(--muted);display:flex;gap:6px;align-items:center}
.stat.bad .v{color:var(--bad)}
.stat.ok .v{color:var(--ok)}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:25;border:0;background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:0 22px;height:60px;font-size:19px;font-weight:800;display:flex;gap:8px;align-items:center;box-shadow:0 6px 18px rgba(80,10,50,.3)}

/* bill */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:10px}
.tile{border:0;background:var(--surface);border-radius:16px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;position:relative}
.tile .art{width:64px;height:64px;border-radius:12px;overflow:hidden;display:grid;place-items:center;font-size:36px}
.tile .art img{width:100%;height:100%;object-fit:cover}
.tile .art svg{width:92%;height:92%}
.tile .nm{font-size:14px;font-weight:600;line-height:1.15;max-height:2.3em;overflow:hidden}
.tile .pr{font-size:16px;font-weight:800}
.tile .cnt{position:absolute;right:4px;top:4px;background:var(--brand);color:var(--brand-ink);border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-weight:800;font-size:15px}
.cart{background:var(--surface);border-radius:22px;padding:14px;margin-top:18px}
.cline{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.cline .qty button{width:40px;height:40px;font-size:22px}
.total{display:flex;justify-content:space-between;align-items:center;font-size:28px;font-weight:800;padding:12px 0 4px}
.paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.paygrid .btn{flex-direction:column;gap:2px;min-height:84px}
.paygrid .btn .ic{font-size:30px}
.minibar{position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:24;max-width:600px;margin:0 auto;border:0;background:var(--ink);color:var(--bg);border-radius:18px;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:800;font-size:19px}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:48px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheethead{display:flex;align-items:center;gap:10px}
.sheethead h3{flex:1;margin:0;font-size:22px}
.field{margin-top:16px}
.field label,.field .lbl{display:block;font-weight:600;margin-bottom:6px}
.inrow{display:flex;gap:8px;align-items:center}
.inrow input,.field textarea{flex:1;min-width:0;height:56px;border-radius:14px;border:2px solid var(--line);background:var(--bg);padding:0 14px;font-size:20px}
.field textarea{height:auto;min-height:90px;padding:10px 14px;font-size:17px;width:100%}
.inrow input:focus,.field textarea:focus{border-color:var(--brand);outline:none}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 2px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--brand)}
.photoBox{display:flex;gap:12px;align-items:center}
.photoBox .art{width:96px;height:96px;border-radius:18px;overflow:hidden;background:var(--surface);display:grid;place-items:center;font-size:44px}
.photoBox .art img{width:100%;height:100%;object-fit:cover}
.photoBox .art svg{width:88%;height:88%}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.bigbal{font-size:42px;font-weight:800;line-height:1.05}
.hist{margin-top:8px}
.hrow{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.hrow .k{font-size:24px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.detailpic{border-radius:22px;overflow:hidden;background:var(--surface);aspect-ratio:1/1;max-height:60vh;margin:0 auto;display:grid;place-items:center;font-size:110px}
.detailpic img{width:100%;height:100%;object-fit:cover}
.detailpic svg{width:60%;height:80%}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msgprev{white-space:pre-wrap;background:var(--surface);border-radius:14px;padding:12px;font-size:16px;margin-top:10px}
.sentmark{color:var(--ok);font-weight:800}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:14px;font-weight:600;max-width:90%;text-align:center}
.loading{padding:30px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap toprow">
    <svg class="mark" viewBox="0 0 40 36" aria-hidden="true"><g fill="none" stroke-width="3.2"><ellipse cx="20" cy="9" rx="15" ry="5" stroke="#1E8A4C"/><ellipse cx="20" cy="15" rx="15" ry="5" stroke="#D4AF37"/><ellipse cx="20" cy="21" rx="15" ry="5" stroke="#C8281E"/><ellipse cx="20" cy="27" rx="15" ry="5" stroke="#A3124F"/></g></svg>
    <p class="shopname" id="shopname"></p>

function bangleSVG(colors){
  let s='';
  for(let i=0;i<colors.length;i++){ const y=20+i*10, c=colors[i];
    s+=`<ellipse cx="50" cy="${y}" rx="36" ry="11" fill="none" stroke="${c}" stroke-width="6.5"/><ellipse cx="50" cy="${y-2}" rx="33" ry="8.5" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="1.3"/>`; }
  return `<svg viewBox="0 0 100 ${30+colors.length*10}" aria-hidden="true">${s}</svg>`;
}

const CATS = [{id:'bangles',chip:'⭕'},{id:'cosmetics',emoji:'💄',chip:'💄'},{id:'threads',chip:'🧵'},{id:'other',emoji:'✨',chip:'✨'}];
function threadSVG(c1,c2){ return `<svg viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="50" cy="40" rx="34" ry="25" fill="none" stroke="${c1}" stroke-width="9"/><ellipse cx="50" cy="40" rx="34" ry="25" fill="none" stroke="${c2}" stroke-width="9" stroke-dasharray="7 9"/><g stroke="${c1}" stroke-width="4" stroke-linecap="round"><path d="M50 66 L43 93"/><path d="M50 66 L50 95"/><path d="M50 66 L57 93"/></g><circle cx="50" cy="66" r="7" fill="${c2}"/></svg>`; }

function catArt(id){ if(id==='all') return '🛍️'; if(id==='threads') return threadSVG('#C8281E','#F2B705'); const c=CATS.find(x=>x.id===id); return c.emoji ? c.emoji : bangleSVG(MIXED.slice(0,4)); }
function art(p){
  if(p.photo) return `<img src="${esc(p.photo)}" alt="">`;
  const c = p.color || '#A3124F';
  if(p.cat==='bangles') return bangleSVG([c,c,'#D4AF37',c,c]);
  if(p.cat==='threads') return threadSVG(c, c==='#D4AF37'?'#C8281E':'#F2B705');
  const cat = CATS.find(x=>x.id===p.cat) || CATS[3];
  return cat.emoji;
}

function loadLocal(){ let d=null; try{ d=JSON.parse(localStorage.getItem('sbs.data')||'null'); }catch(e){} if(!d) d={products:JSON.parse(JSON.stringify(STARTER))}; for(const k of Object.keys(S)) if(d[k]) S[k]=d[k]; }
function handleErr(e){ const c=e&&e.code; if(c==='invalid_argument') toast(t('noPerm')); else if(c==='quota_exceeded') toast(t('full')); else toast(t('tryAgain')); }
function dbWrite(path, data){
  const q = wq[path] || (wq[path]={dirty:false,busy:false});
  q.data=data; q.dirty=true; clearTimeout(q.t); q.t=setTimeout(()=>flush(path),350);
}
async function flush(path){
  const q=wq[path]; if(q.busy) return; q.busy=true;
  while(q.dirty){ q.dirty=false; const d=q.data;
    for(let attempt=0; attempt<2; attempt++){
      try{ const ref=DB.doc(path); if(d===null) await ref.delete(); else await ref.set(d); break; }
      catch(e){ if(e&&e.code==='unavailable'&&attempt===0){ await new Promise(r=>setTimeout(r,500+Math.random()*700)); continue; } handleErr(e); break; }
    }
  }
  q.busy=false;
}
const DOCPATH = {shop:'shop/info', priv:'private/config'};
function put(col,id,obj){
  if(obj===null) delete S[col][id]; else S[col][id]=obj;
  if(DB) dbWrite(col+'/'+id, obj); else saveLocal();
  render(); refreshSheet();
}
function putDoc(key,obj){ S[key]=obj; if(DB) dbWrite(DOCPATH[key], obj); else saveLocal(); render(); }
function overlay(col){ for(const [path,q] of Object.entries(wq)){ if(!(q.dirty||q.busy)) continue; const [c,id]=path.split('/'); if(c!==col) continue; if(q.data===null) delete S[col][id]; else S[col][id]=q.data; } }

async function initStore(){
  loadLocal();
  const C = window.claude;
  if(!C || typeof C.use!=='function'){ st.mode='local'; st.loaded=true; st.canOwner=true; afterAuth(); return; }
  let db=null, user=null;
  try{ [db,user] = await Promise.all([C.use('db'), C.use('user')]); }catch(e){}
  if(!db){ st.mode='local'; st.loaded=true; st.canOwner=true; afterAuth(); return; }
  DB=db; st.mode='db';
  for(const k of Object.keys(S)) S[k] = (k==='products'||k==='customers'||k==='entries')?{}:{};
  try{ st.canOwner = user ? !!(await user.canEdit()) : true; }catch(e){ st.canOwner=false; }
  if(!st.canOwner) st.owner=false;
  const sub = (col)=> DB.collection(col).onSnapshot(snap=>{
      const o={}; snap.docs.forEach(d=>{ o[d.id]=d.data(); }); S[col]=o; overlay(col);
      if(col==='products') st.loaded=true; render(); refreshSheet();
    }, ()=>{ if(col==='products'){ st.loaded=true; render(); } });
  sub('products');
  DB.doc('shop/info').onSnapshot(s=>{ S.shop = s.exists ? s.data() : {}; render(); }, ()=>{});
  if(st.canOwner){
    sub('customers'); sub('entries');
    DB.doc('private/config').onSnapshot(s=>{ S.priv = s.exists ? s.data() : {}; }, ()=>{});
  }
  afterAuth();
}
function afterAuth(){ if(st.wantOwner && st.canOwner){ st.owner=true; st.view='bill'; } render(true); }

/* ---------- voice ---------- */
let rec=null, recBtn=null;
function listen(btn, cb){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast(t('noVoice')); return; }
  if(rec){ try{rec.stop();}catch(e){} return; }
  try{
    rec = new SR(); rec.lang = locale(); rec.interimResults=false; rec.maxAlternatives=1;
    recBtn=btn; btn.classList.add('live'); toast(t('listening'));
    rec.onresult = e => { const txt=e.results[0][0].transcript; cb(txt); };
    rec.onerror = e => { toast(e.error==='not-allowed'||e.error==='service-not-allowed' ? t('micBlocked') : (e.error==='no-speech'? t('listening') : t('noVoice'))); };
    rec.onend = () => { if(recBtn) recBtn.classList.remove('live'); rec=null; recBtn=null; };
    rec.start();
  }catch(e){ if(btn) btn.classList.remove('live'); rec=null; toast(t('noVoice')); }
}
function say(text){
  try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang=locale(); u.rate=.92; speechSynthesis.speak(u); }catch(e){}
}

/* ---------- messaging ---------- */
function openUrl(u){ let w=null; try{ w=window.open(u,'_blank'); }catch(e){} if(w){ try{ w.opener=null; }catch(e){} } else location.href=u; }
function sendWA(phone,text){ const p=cleanPhone(phone); openUrl((p?`https://wa.me/91${p}`:'https://wa.me/')+'?text='+encodeURIComponent(text)); }
function sendSMS(phone,text){ const p=cleanPhone(phone); openUrl(`sms:${p?'+91'+p:''}?&body=`+encodeURIComponent(text)); }

/* ---------- toast ---------- */
let toastT=null;
function toast(msg){ const r=$('#toastRoot'); r.innerHTML=`<div class="toast">${esc(msg)}</div>`; clearTimeout(toastT); toastT=setTimeout(()=>{r.innerHTML='';},2600); }

/* ---------- computed ---------- */
function balance(cid){ let b=0; for(const e of Object.values(S.entries)){ if(e.cid!==cid) continue; const a=Number(e.amount)||0;
  if(e.kind==='udhaar'||(e.kind==='sale'&&e.pay==='udhaar')) b+=a; else if(e.kind==='jama') b-=a; } return b; }
function todayStats(){ const k=dayKey(Date.now()); const r={total:0,cash:0,upi:0,udhaar:0};
  for(const e of Object.values(S.entries)){ if(e.kind!=='sale'||dayKey(e.ts)!==k) continue; const a=Number(e.amount)||0; r.total+=a; r[e.pay]=(r[e.pay]||0)+a; }
  return r; }
function haystack(p){ const parts=[];
  const n=p.name; if(n&&typeof n==='object') parts.push(...Object.values(n)); else parts.push(n);
  parts.push(p.kw||''); if(p.cat&&T[p.cat]) parts.push(...T[p.cat]); if(p.type&&T[p.type]) parts.push(...T[p.type]);
  return norm(parts.join(' ')); }
function searchProducts(q, items){
  const words = norm(q).split(/[\s,.!?।]+/).filter(w=>w.length>=2);
  if(!words.length) return items;
  return items.map(p=>{ const h=haystack(p); return [p, words.filter(w=>h.includes(w)).length]; })
    .filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
}
const lows = () => list('products').filter(isLow).sort((a,b)=>(a.qty||0)-(b.qty||0));

/* ---------- render: chrome ---------- */
function renderChrome(){
  document.documentElement.lang = st.lang;
  document.body.classList.toggle('owner', st.owner);
  document.body.classList.toggle('v-shop', st.view==='shop');
  $('#shopname').textContent = shopName();
  $('#langs').innerHTML = [['en','EN'],['hi','हिं'],['mr','मरा']].map(([k,l])=>`<button data-act="lang" data-v="${k}" aria-pressed="${st.lang===k}" aria-label="${k==='en'?'English':k==='hi'?'हिंदी':'मराठी'}">${l}</button>`).join('');
  const ob=$('#ownerBtn'); ob.hidden=!st.canOwner; ob.classList.toggle('on',st.owner);
  ob.textContent = st.owner ? '👁️' : '🔑'; ob.setAttribute('aria-label', st.owner? t('ownerOff') : t('ownerOn')); ob.title = ob.getAttribute('aria-label');
  $('#setBtn').hidden = !st.owner;
  $('#nav').hidden = !st.owner;
  if(st.owner){
    const items=[['shop','🏪'],['bill','🧾'],['stock','📦'],['khata','📒'],['cust','👥']];
    $('#navin').innerHTML = items.map(([v,ic])=>`<button data-act="nav" data-v="${v}" ${st.view===v?'aria-current="page"':''}><span class="ic">${ic}</span>${t(v)}</button>`).join('');
    const L = lows();
 $('#lowslot').innerHTML = (L.length && st.view!=='stock') ? `<button class="lowbar" data-act="goLow"><b style="font-size:22px">⚠️</b><span>${L.length} ${t('lowItems')}</span><b>›</b></button>` : '';
  } else { $('#lowslot').innerHTML=''; }
}

function render(force){
  const ae=document.activeElement;
  if(!force && ae && $('#main').contains(ae) && /INPUT|TEXTAREA/.test(ae.tagName)){ pendingRender=true; renderChrome(); return; }
  pendingRender=false;
  if(!st.owner && st.view!=='shop') st.view='shop';
  renderChrome();
  const v = st.view;
  $('#main').innerHTML = v==='shop'?viewShop(): v==='bill'?viewBill(): v==='stock'?viewStock(): v==='khata'?viewKhata(): viewCust();
  renderFloaty();
}
document.addEventListener('focusout', ()=>{ setTimeout(()=>{ if(pendingRender && !( $('#main').contains(document.activeElement) && /INPUT|TEXTAREA/.test(document.activeElement.tagName))) render(true); },0); });

function renderFloaty(){
  let h='';
  if(st.owner && st.view==='stock') h=`<button class="fab" data-act="addItem"><span style="font-size:24px">＋</span>${t('addItem')}</button>`;
  if(st.owner && st.view==='cust') h=`<button class="fab" data-act="addCust"><span style="font-size:24px">＋</span>${t('addCust')}</button>`;
  if(st.owner && st.view==='bill' && st.cart.length){ const tot=cartTotal(); h=`<button class="minibar" data-act="toCart"><span>🧾 ${st.cart.reduce((a,c)=>a+c.qty,0)}</span><span>${t('total')} ₹${fmt(tot)} ›</span></button>`; }
  $('#floaty').innerHTML=h;
}

function shopItems(){
  let items = list('products');
  if(st.cat!=='all') items = items.filter(p=>p.cat===st.cat);
  if(st.cat==='bangles' && st.type) items = items.filter(p=>p.type===st.type);
  items.sort((a,b)=>((b.qty>0)-(a.qty>0)) || pname(a).localeCompare(pname(b)));
  return st.q ? searchProducts(st.q, items) : items;
}
function gridHTML(){
  if(!st.loaded) return `<div class="loading">${t('loading')}</div>`;
  const all = list('products');
  if(!all.length) return st.owner ? `<div class="empty"><div class="ic">📦</div><p>${t('emptyCust')}</p><button class="btn brand" data-act="addItem">＋ ${t('firstItem')}</button></div>` : `<div class="empty"><div class="ic">🏪</div><p>${t('emptyCust')}</p></div>`;
  const items = shopItems();
  if(!items.length) return `<div class="empty"><div class="ic">🔍</div><p>${t('noItems')}</p></div>`;
  return `<div class="grid">` + items.map(cardHTML).join('') + `</div>`;
}

function billText(e, cust){
  const lines = e.items.map(i=>`• ${i.name} × ${i.qty} = ₹${fmt(i.price*i.qty)}`).join('\n');
  const parts=[`🧾 ${shopName()}`, dateStr(e.ts)+(cust?`\n${cust.name}`:''), '', lines, '', `${t('total')}: ₹${fmt(e.amount)}`, `${t('paidBy')}: ${t(e.pay)}`];

/* ---------- inputs ---------- */
function setField(key, val){
  if(key==='q'){ st.q=val; const g=$('#grid'); if(g) g.innerHTML=gridHTML(); return; }
  if(key==='sq'){ st.sq=val; const g=$('#stockList'); if(g) g.innerHTML=stockListHTML(); return; }
  if(key==='bq'){ st.bq=val; const g=$('#tiles'); if(g) g.innerHTML=tilesHTML(); return; }
  if(key==='msgExtra'){ st.msgExtra=val; const pv=$('#msgprev'); if(pv) pv.textContent=stockMsgText(); return; }
  const [ns,k]=key.split('.');
  const obj = ns==='f'?st.form: ns==='c'?st.cform: ns==='s'?st.sform: ns==='m'?st.money: ns==='nc'?st.newCust: null;
  if(obj) obj[k]=val;
}
document.addEventListener('input', e=>{ const el=e.target; const k=el.dataset&&el.dataset.in; if(!k||k==='photo') return; setField(k, el.value); });
document.addEventListener('change', async e=>{
  const el=e.target; if(!(el.dataset&&el.dataset.in==='photo')) return;
  const file=el.files&&el.files[0]; if(!file) return;
  try{ st.form.photo = await shrink(file); drawSheet(); }catch(err){ toast(t('tryAgain')); }
});
function shrink(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onerror=rej; r.onload=()=>{ const img=new Image(); img.onerror=rej; img.onload=()=>{
  const max=360, s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.72)); }; img.src=r.result; }; r.readAsDataURL(file); }); }

      if(!nm) return toast(t('needName')); if(st.newCust.phone && !ph) return toast(t('badPhone'));
      cid=uid('c'); put('customers', cid, {name:nm, phone:ph, likes:[], created:Date.now(), lastTs:Date.now()}); }
    if(pay==='udhaar' && !cid) return toast(t('needCust'));
    const e={kind:'sale', pay, cid:cid||'', amount:cartTotal(), items:st.cart.map(c=>({name:c.name,qty:c.qty,price:c.price})), ts:Date.now()};
    put('entries', uid('e'), e);
    const newlyLow=[];
    for(const c of st.cart){ if(!c.pid||!S.products[c.pid]) continue; const p=S.products[c.pid]; const was=isLow(p); const np=Object.assign({},p,{qty:Math.max(0,(Number(p.qty)||0)-c.qty)}); put('products', c.pid, np); if(!was&&isLow(np)) newlyLow.push(pname(np)); }
    if(cid && S.customers[cid]) put('customers', cid, Object.assign({}, S.customers[cid], {lastTs:Date.now()}));
    const cust = cid ? Object.assign({id:cid}, S.customers[cid]) : null;
    const text=billText(e, cust);
    doneInfo={text, phone:cust?cust.phone:'', say:m('sayTotal', fmt(e.amount))};
    st.cart=[]; st.billCust=''; st.newCust=null; st.bq=''; render(true);
    openSheet(()=>doneSheet(doneInfo.text, doneInfo.phone, doneInfo.say));
    if(newlyLow.length) setTimeout(()=>toast(`⚠️ ${newlyLow.join(', ')}: ${t('isLow')}`), 2700);
  },
  sendDone(b){ if(!doneInfo) return; if(b.dataset.how==='sms') sendSMS(doneInfo.phone, doneInfo.text); else sendWA(doneInfo.phone, doneInfo.text); },
  sayDone(){ if(doneInfo) say(doneInfo.say); },
  openKhata(b){ const id=b.dataset.id; st.khataCid=id; st.money=null; openSheet(()=>khataSheet(id)); },
  sayBal(b){ const c=S.customers[b.dataset.id]; if(c) say(m('sayBal', c.name, fmt(Math.max(0,balance(b.dataset.id))))); },
  mStart(b){ st.money={kind:b.dataset.v, amount:'', note:''}; drawSheet(); setTimeout(()=>{ const i=$('#mAmt'); if(i) i.focus(); },50); },
  mCancel(){ st.money=null; drawSheet(); },
  mSave(){
    const f=st.money; const a=numFrom(f.amount); if(isNaN(a)||a<=0) return toast(t('needAmt'));
    const cid = st.khataCid; const c=S.customers[cid]; if(!c) return;
    put('entries', uid('e'), {kind:f.kind, cid, amount:a, note:(f.note||'').trim(), ts:Date.now()});
    put('customers', cid, Object.assign({}, c, {lastTs:Date.now()}));
    const bal=Math.max(0,balance(cid)); const text = f.kind==='jama' ? m('got', c.name, fmt(a), fmt(bal), shopName()) : m('gave', c.name, fmt(a), fmt(bal), shopName());
    st.money=null; doneInfo={text, phone:c.phone, say:m('sayBal', c.name, fmt(bal))};
    openSheet(()=>doneSheet(doneInfo.text, doneInfo.phone, doneInfo.say));
  },
  remind(b){ const c=S.customers[b.dataset.id]; if(!c) return; let text=m('remind', c.name, fmt(balance(b.dataset.id)), shopName()); if(S.shop.upi) text+=`\nUPI: ${S.shop.upi}`; if(b.dataset.how==='sms') sendSMS(c.phone,text); else sendWA(c.phone,text); },
  addCust(){ st.cform={id:'',name:'',phone:'',likes:[]}; openSheet(custForm); },
  editCust(b){ const c=S.customers[b.dataset.id]; if(!c) return; st.cform={id:b.dataset.id,name:c.name||'',phone:c.phone||'',likes:[...(c.likes||[])]}; openSheet(custForm); },
  likeToggle(b){ const v=b.dataset.v, L=st.cform.likes; const i=L.indexOf(v); if(i>=0) L.splice(i,1); else L.push(v); drawSheet(); },
  saveCust(){ const f=st.cform; const nm=(f.name||'').trim(); const ph=cleanPhone(f.phone);
    if(!nm) return toast(t('needName')); if(f.phone && !ph) return toast(t('badPhone'));
    const prev = f.id ? S.customers[f.id] : null;
    put('customers', f.id||uid('c'), Object.assign({}, prev||{created:Date.now(), lastTs:Date.now()}, {name:nm, phone:ph, likes:f.likes}));
    closeSheet(); toast(t('saved')); },
  deleteCust(){ const f=st.cform; if(!f.confirmDel){ f.confirmDel=true; drawSheet(); return; } put('customers', f.id, null); closeSheet(); toast(t('deleted')); },
  waCust(b){ const c=S.customers[b.dataset.id]; if(c) sendWA(c.phone, `${['Namaste','नमस्ते','नमस्कार'][LI()]} ${c.name} 🙏`); },
  stockMsg(){ st.msgSel={}; st.msgExtra=''; st.sentIds={}; st.msgLikers=true; openSheet(stockMsgSheet); },
  msgPick(b){ st.msgSel[b.dataset.id]=!st.msgSel[b.dataset.id]; drawSheet(); },
  msgLikers(){ st.msgLikers=!st.msgLikers; drawSheet(); },
  msgSend(b){ const c=S.customers[b.dataset.id]; if(!c) return; sendWA(c.phone, stockMsgText()); st.sentIds[b.dataset.id]=true; drawSheet(); },
  settings(){ st.sform={phone:S.shop.phone||'', upi:S.shop.upi||'', alert:S.priv.alert||''}; openSheet(settingsSheet); },
  saveSettings(){ const f=st.sform; const p=cleanPhone(f.phone), a=cleanPhone(f.alert);
    if(f.phone && !p) return toast(t('badPhone')); if(f.alert && !a) return toast(t('badPhone'));
    putDoc('shop', Object.assign({}, S.shop, {phone:p, upi:(f.upi||'').trim()}));
    putDoc('priv', Object.assign({}, S.priv, {alert:a}));
    closeSheet(); toast(t('saved')); }
};
function updateBill(){ const tl=$('#tiles'); if(tl) tl.innerHTML=tilesHTML(); const c=$('#cart'); if(c) c.innerHTML=cartHTML(); renderFloaty(); }
document.addEventListener('click', e=>{ const b=e.target.closest('[data-act]'); if(!b) return; const fn=A[b.dataset.act]; if(fn){ if(b.dataset.act!=='scrim') e.preventDefault(); fn(b,e); } });

render(true);
initStore();
})();
</script>
